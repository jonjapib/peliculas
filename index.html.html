<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Qué película vemos hoy?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at top, #28244d, #10101c 70%);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #fff;
      padding: 22px;
    }
    .app { width: min(100%, 560px); background: #1c1b31; border: 1px solid #45415f;
      border-radius: 22px; padding: 30px; box-shadow: 0 22px 75px #0007; }
    h1 { text-align: center; margin: 0 0 9px; font-size: clamp(24px, 5vw, 34px); }
    .subtitle { text-align: center; color: #bab8d3; margin: 0 0 25px; }
    label { display: block; font-weight: 650; margin-bottom: 9px; }
    textarea { width: 100%; min-height: 170px; resize: vertical; padding: 15px;
      color: #fff; background: #111021; border: 1px solid #514b70;
      border-radius: 12px; font: inherit; line-height: 1.6; outline: none; }
    textarea:focus { border-color: #b5a2ff; }
    textarea::placeholder { color: #9290b1; }
    .hint { color: #aaa7c5; font-size: 13px; margin: 8px 0 20px; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 15px 18px;
      background: #b5a2ff; color: #1b1436; font: inherit; font-weight: 750;
      font-size: 16px; cursor: pointer; transition: background .2s, transform .2s; }
    button:hover { background: #cbbcfc; transform: translateY(-1px); }
    button:disabled { opacity: .6; cursor: wait; transform: none; }
    .result { margin-top: 22px; padding: 26px 16px; min-height: 125px; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; border: 1px dashed #777093; border-radius: 14px;
      background: #24223e; gap: 10px; }
    .result small { text-transform: uppercase; letter-spacing: .16em; color: #c7bddf; }
    #winner { font-size: clamp(21px, 5vw, 29px); overflow-wrap: anywhere; font-weight: 800; }
    .error { color: #ffb5b5; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🎬 ¿Qué película vemos hoy?</h1>
    <p class="subtitle">Escribe tus opciones y deja que el azar decida.</p>
    <label for="movies">Tus películas</label>
    <textarea id="movies" placeholder="Interestelar&#10;Titanic&#10;Shrek&#10;El origen"></textarea>
    <p class="hint">Escribe una película por línea. También puedes separarlas con comas.</p>
    <button id="draw" type="button">🎲 Elegir película al azar</button>
    <div class="result" aria-live="polite" aria-atomic="true">
      <small id="status">Resultado</small>
      <div id="winner">Tu película aparecerá aquí 🍿</div>
    </div>
  </main>
  <script>
    const textarea = document.getElementById('movies');
    const button = document.getElementById('draw');
    const winner = document.getElementById('winner');
    const status = document.getElementById('status');
    let lastWinner = '';

    // Conserva la lista de películas en este navegador.
    textarea.value = localStorage.getItem('misPeliculas') || '';
    textarea.addEventListener('input', () => {
      localStorage.setItem('misPeliculas', textarea.value);
    });

    button.addEventListener('click', () => {
      const movies = [...new Set(
        textarea.value.split(/[\n,]+/).map(name => name.trim()).filter(Boolean)
      )];
      if (!movies.length) {
        status.textContent = 'Falta tu lista';
        winner.textContent = 'Primero escribe al menos una película.';
        winner.classList.add('error');
        return;
      }
      winner.classList.remove('error');
      button.disabled = true;
      status.textContent = 'Sorteando...';

      // Si hay varias opciones, evita repetir la última inmediatamente.
      const choices = movies.length > 1
        ? movies.filter(movie => movie !== lastWinner)
        : movies;
      const selected = choices[Math.floor(Math.random() * choices.length)];

      let ticks = 0;
      const animation = setInterval(() => {
        winner.textContent = movies[Math.floor(Math.random() * movies.length)];
        ticks++;
        if (ticks >= 12) {
          clearInterval(animation);
          winner.textContent = '🎉 ' + selected;
          status.textContent = '¡La elegida es!';
          lastWinner = selected;
          button.disabled = false;
        }
      }, 80);
    });
  </script>
</body>
</html>
